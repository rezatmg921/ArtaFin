name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ArtaFin.sln
      - name: Build
        run: dotnet build ArtaFin.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test ArtaFin.sln --no-build --configuration Release --logger "trx;LogFileName=results.trx"
