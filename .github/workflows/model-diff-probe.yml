name: Temporary model diff probe

on:
  push:
    branches: [feat/account-aggregate-repository]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore EF Core tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore ArtaFin.sln
      - name: Generate model diff migration
        run: dotnet ef migrations add ModelDiffProbe --project src/ArtaFin.Infrastructure/ArtaFin.Infrastructure.csproj --startup-project src/ArtaFin.Infrastructure/ArtaFin.Infrastructure.csproj --configuration Release --output-dir Persistence/Migrations
      - name: Upload generated model diff
        uses: actions/upload-artifact@v4
        with:
          name: model-diff-probe
          path: |
            src/ArtaFin.Infrastructure/Persistence/Migrations/*_ModelDiffProbe.cs
            src/ArtaFin.Infrastructure/Persistence/Migrations/*_ModelDiffProbe.Designer.cs
            src/ArtaFin.Infrastructure/Persistence/Migrations/ArtaFinDbContextModelSnapshot.cs
          if-no-files-found: error
